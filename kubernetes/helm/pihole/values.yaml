persistentVolumeClaim:
  enabled: true
  storageClass: "longhorn"
  size: 5Gi

adminPassword: "admin-change-me"

virtualHost: pihole.homelab.local

serviceWeb:
  type: ClusterIP

serviceDns:
  loadBalancerIP: 192.168.86.201
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer

serviceDhcp:
  enabled: "false"

ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts:
    - pihole.homelab.local

podDnsConfig:
  enabled: true
  policy: "None"
  nameservers:
  - unbound.dns.svc.cluster.local
  - unbound.dns.svc.cluster.local

dnsmasq:
  customDnsEntries:
    - address=/homelab.local/192.168.86.200
