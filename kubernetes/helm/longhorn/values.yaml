global:
  storageClass:
    defaultClass: true

persistence:
  defaultClassReplicaCount: 1  # Configured for single-node K3s setup

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  replicaAutoBalance: disabled
  storageMinimalAvailablePercentage: 15
  # This is a single-node cluster. Create the default disk automatically on
  # the node instead of requiring the Kubernetes node label
  # node.longhorn.io/create-default-disk=true.
  createDefaultDiskLabeledNodes: false
  defaultReplicaCount: 1

preUpgradeChecker:
  jobEnabled: false

ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.homelab.local

longhornUI:
  replicas: 1
