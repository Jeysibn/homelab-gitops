adminPassword: "admin-change-me"

persistence:
  enabled: true
  storageClassName: "longhorn"
  size: 5Gi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.homelab.local

# Automatically add Prometheus and Loki datasources inside Grafana
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http