adminPassword: "admin-change-me"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 256Mi

persistence:
  enabled: true
  storageClassName: "longhorn"
  size: 5Gi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.homelab.local

# Automatically add Prometheus and Loki datasources inside Grafana
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
