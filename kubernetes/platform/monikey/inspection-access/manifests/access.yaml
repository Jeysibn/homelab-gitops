apiVersion: v1
kind: ServiceAccount
metadata:
  name: monikey-schema-inspector
  namespace: monikey
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monikey-schema-inspector
  namespace: monikey
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["postgres-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: ["postgres-0"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monikey-schema-inspector
  namespace: monikey
subjects:
  - kind: ServiceAccount
    name: monikey-schema-inspector
    namespace: monikey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monikey-schema-inspector

---
# The existing backup workflow identity may request a short-lived token for
# this one read-only ServiceAccount. It still cannot create RBAC or other tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monikey-inspection-token-issuer
  namespace: monikey
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["monikey-schema-inspector"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monikey-inspection-token-issuer
  namespace: monikey
subjects:
  - kind: ServiceAccount
    name: monikey-backup
    namespace: monikey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monikey-inspection-token-issuer
