apiVersion: v1
kind: ConfigMap
metadata:
  name: monikey-db-migration-003
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  003_current_account_amounts.sql: |
    -- Verify a backup before applying to an existing database.
    -- Current-amount corrections may require signed baselines; ledger rows stay intact.
    BEGIN;
    ALTER TABLE accounts DROP CONSTRAINT IF EXISTS accounts_opening_balance_check;
    ALTER TABLE accounts DROP CONSTRAINT IF EXISTS accounts_opening_debt_check;
    COMMIT;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: monikey-db-migration-003
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monikey-db-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready --dbname="$DATABASE_URL"; do
                sleep 2
              done
              psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file /migration/003_current_account_amounts.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monikey-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
      volumes:
        - name: migration
          configMap:
            name: monikey-db-migration-003
