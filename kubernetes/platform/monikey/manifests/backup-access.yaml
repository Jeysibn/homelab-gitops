apiVersion: v1
kind: ServiceAccount
metadata:
  name: monikey-backup
  namespace: monikey
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monikey-backup
  namespace: monikey
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["postgres-0"]
    verbs: ["create", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monikey-backup
  namespace: monikey
subjects:
  - kind: ServiceAccount
    name: monikey-backup
    namespace: monikey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monikey-backup
