apiVersion: v1
kind: ConfigMap
metadata:
  name: monikey-db-migration-002
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  002_account_transfers.sql: |
    -- Add liquid-account transfers to an existing MoniKey database.
    -- Take and verify a backup before applying this migration.
    BEGIN;

    CREATE TABLE IF NOT EXISTS account_transfers (
      id INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      source_account_id INTEGER NOT NULL REFERENCES accounts(id),
      destination_account_id INTEGER NOT NULL REFERENCES accounts(id),
      amount NUMERIC(12, 2) NOT NULL CHECK (amount > 0),
      transfer_date DATE NOT NULL,
      note TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      CHECK (source_account_id <> destination_account_id)
    );

    CREATE INDEX IF NOT EXISTS idx_account_transfers_source_date
      ON account_transfers(source_account_id, transfer_date DESC);

    CREATE INDEX IF NOT EXISTS idx_account_transfers_destination_date
      ON account_transfers(destination_account_id, transfer_date DESC);

    COMMIT;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: monikey-db-migration-002
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monikey-db-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready --dbname="$DATABASE_URL"; do
                sleep 2
              done
              psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file /migration/002_account_transfers.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monikey-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
      volumes:
        - name: migration
          configMap:
            name: monikey-db-migration-002
