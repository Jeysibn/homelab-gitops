apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monikey
  namespace: monikey
  annotations:
    cert-manager.io/cluster-issuer: homelab-selfsigned
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - monikey.homelab.local
      secretName: monikey-tls
  rules:
    - host: monikey.homelab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
