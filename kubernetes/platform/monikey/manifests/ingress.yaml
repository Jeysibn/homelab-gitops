apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monikey
  namespace: monikey
  annotations:
    cert-manager.io/cluster-issuer: homelab-selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - monikey.homelab.local
      secretName: monikey-tls
  rules:
    - host: monikey.homelab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
