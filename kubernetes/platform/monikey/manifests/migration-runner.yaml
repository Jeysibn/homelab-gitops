apiVersion: v1
kind: ConfigMap
metadata:
  name: monikey-schema-migration
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  MONIKEY_MIGRATION_ADOPT: "true"
  MONIKEY_MIGRATION_APPLY: "true"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: monikey-schema-migration
  namespace: monikey
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monikey-schema-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/jeysibn/monikey-v2-api:sha-3f8a6d0466d34aee0dd65d864f146df5f4232015
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/database/migrate.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monikey-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: monikey-schema-migration
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
