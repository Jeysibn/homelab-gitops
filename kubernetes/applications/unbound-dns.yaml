apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unbound-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jeysibn/homelab-gitops.git
    targetRevision: main
    path: kubernetes/platform/dns/unbound/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
