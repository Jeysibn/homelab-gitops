apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: dns
data:
  unbound.conf: |
    server:
      do-daemonize: no
      use-syslog: no
      verbosity: 1
      interface: 0.0.0.0
      port: 5335
      chroot: ""
      username: ""
      directory: "/tmp"
      pidfile: ""
      auto-trust-anchor-file: ""
      access-control: 0.0.0.0/0 allow
      harden-glue: yes
      harden-dnssec-stripped: yes
      use-caps-for-id: no
      edns-buffer-size: 1220
      prefetch: yes
      num-threads: 1
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: dns
spec:
  clusterIP: 10.43.151.153
  ports:
  - name: dns-udp
    port: 5335
    targetPort: 5335
    protocol: UDP
  - name: dns-tcp
    port: 5335
    targetPort: 5335
    protocol: TCP
  selector:
    app: unbound
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: unbound
        image: klutchell/unbound:v1.20.0
        args:
        - -c
        - /config/unbound.conf
        ports:
        - containerPort: 5335
          name: dns-udp
          protocol: UDP
        - containerPort: 5335
          name: dns-tcp
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        readinessProbe:
          tcpSocket:
            port: 5335
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 5335
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: unbound-config
      - name: tmp
        emptyDir: {}
