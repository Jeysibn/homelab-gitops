apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      containers:
      - name: unbound
        image: klutchell/unbound:v1.20.0
        ports:
        - containerPort: 5335
          name: dns-udp
          protocol: UDP
        - containerPort: 5335
          name: dns-tcp
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: config
          mountPath: /etc/unbound/unbound.conf
          subPath: unbound.conf
      volumes:
      - name: config
        configMap:
          name: unbound-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: dns
data:
  unbound.conf: |
    server:
      do-daemonize: no
      use-syslog: no
      verbosity: 1
      interface: 0.0.0.0
      port: 5335
      access-control: 0.0.0.0/0 allow
      harden-glue: yes
      harden-dnssec-stripped: yes
      use-caps-for-id: no
      edns-buffer-size: 1220
      prefetch: yes
      num-threads: 1