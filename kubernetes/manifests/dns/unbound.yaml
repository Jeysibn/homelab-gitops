apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: dns
data:
  unbound.conf: |
    server:
      do-daemonize: no
      use-syslog: no
      verbosity: 1
      interface: 0.0.0.0
      port: 5335
      access-control: 0.0.0.0/0 allow
      harden-glue: yes
      harden-dnssec-stripped: yes
      use-caps-for-id: no
      edns-buffer-size: 1220
      prefetch: yes
      num-threads: 1
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: dns
spec:
  ports:
  - name: dns-udp
    port: 5335
    targetPort: 5335
    protocol: UDP
  - name: dns-tcp
    port: 5335
    targetPort: 5335
    protocol: TCP
  selector:
    app: unbound
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: unbound
        image: klutchell/unbound:v1.20.0
        ports:
        - containerPort: 5335
          name: dns-udp
          protocol: UDP
        - containerPort: 5335
          name: dns-tcp
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/unbound/unbound.conf
          subPath: unbound.conf
        - name: tmp
          mountPath: /tmp
        - name: unbound-var
          mountPath: /opt/unbound/etc/unbound/var
      volumes:
      - name: config
        configMap:
          name: unbound-config
      - name: tmp
        emptyDir: {}
      - name: unbound-var
        emptyDir: {}
