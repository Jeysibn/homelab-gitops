apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monikey-v2
  namespace: monikey-v2
  labels:
    app.kubernetes.io/name: monikey-v2-web
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - monikey.homelab.local
      secretName: monikey-v2-web-tls
  rules:
    - host: monikey.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
