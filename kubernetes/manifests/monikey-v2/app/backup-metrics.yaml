apiVersion: v1
kind: Service
metadata:
  name: backup-metrics
  labels:
    app.kubernetes.io/name: monikey-v2-backup-metrics
    app.kubernetes.io/part-of: monikey-v2
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app.kubernetes.io/name: monikey-v2-backup-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monikey-v2-backup-metrics
  labels:
    app.kubernetes.io/name: monikey-v2-backup-metrics
    app.kubernetes.io/part-of: monikey-v2
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monikey-v2-backup-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monikey-v2-backup-metrics
        app.kubernetes.io/part-of: monikey-v2
        app.kubernetes.io/component: monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics
          # Replace with the immutable digest from the validated-main release.
          image: ghcr.io/jeysibn/monikey-v2-backup-metrics@sha256:5a9e8ec7decd45e3a18bce51e4bcb92b64af79b76f38c738e31d513e1cc0feda
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backup-data
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: monikey-v2-backups
