apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: monikey-v2-api
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: monikey-v2-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monikey-v2-api
  labels:
    app.kubernetes.io/name: monikey-v2-api
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: monikey-v2-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monikey-v2-api
        app.kubernetes.io/part-of: monikey-v2
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with the immutable digest published from validated main.
          image: ghcr.io/jeysibn/monikey-v2-api@sha256:c125d5f7d1e5e9ca7f2f5ce9f922e47ff633ecedd4a57d7d815a977b9fe1163e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: monikey-v2-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monikey-v2-runtime-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
