apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monikey-v2-private-root
  labels:
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  isCA: true
  commonName: MoniKey V2 Homelab Root CA
  secretName: monikey-v2-private-root
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: homelab-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: monikey-v2-private-ca
  labels:
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: monikey-v2-private-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monikey-v2-web
  labels:
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: monikey-v2-web-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - monikey.homelab.local
  issuerRef:
    name: monikey-v2-private-ca
    kind: Issuer
    group: cert-manager.io
