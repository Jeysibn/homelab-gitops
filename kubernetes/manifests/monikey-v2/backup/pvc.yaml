apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monikey-v2-backups
  labels:
    app.kubernetes.io/name: monikey-v2-backup
    app.kubernetes.io/part-of: monikey-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
