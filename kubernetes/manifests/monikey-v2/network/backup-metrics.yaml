apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monikey-v2-backup-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: monikey-v2-backup-metrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
