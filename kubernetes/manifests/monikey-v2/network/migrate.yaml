apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monikey-v2-migrate-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: monikey-v2-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: monikey-v2-postgres
      ports:
        - protocol: TCP
          port: 5432
