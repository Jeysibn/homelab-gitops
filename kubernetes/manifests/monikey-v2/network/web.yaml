apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monikey-v2-web-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: monikey-v2-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: monikey-v2-api
      ports:
        - protocol: TCP
          port: 3000
