apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: monikey
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: monikey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Bump alongside migrate-job.yaml / worker.yaml when promoting a new build.
          image: ghcr.io/jeysibn/monikey-api:latest
          command: ["node", "dist/server.js"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: monikey-config
            - secretRef:
                name: monikey-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: receipts
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: receipts
          persistentVolumeClaim:
            claimName: monikey-receipts
        - name: tmp
          emptyDir: {}
