apiVersion: batch/v1
kind: Job
metadata:
  name: monikey-migrate
  namespace: monikey
  annotations:
    # Run during the Sync phase after wave 0 prerequisites (ConfigMap, PVCs,
    # PostgreSQL Service/StatefulSet) are healthy, but before application
    # workloads in wave 2. A PreSync hook would always run before those normal
    # Sync resources and can therefore fail on a fresh deployment.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/jeysibn/monikey-api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: monikey-config
            - secretRef:
                name: monikey-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
