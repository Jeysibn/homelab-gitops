apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: monikey
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: monikey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        # nginx:alpine's stock image ships an unprivileged `nginx` user
        # (uid/gid 101) but the master process normally still needs root to
        # bind :80. Running as uid 101 plus NET_BIND_SERVICE below gets the
        # same result without a root container — no image change needed.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/jeysibn/monikey-web:CHANGEME
          ports:
            - containerPort: 80
              name: http
          env:
            # docker/nginx.conf's resolver placeholder — in-cluster DNS
            # resolves the `api` Service name the same way Docker's embedded
            # DNS does in compose.yaml.
            - name: NGINX_DNS_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # NOT read-only: docker/resolve-nginx-dns.sh (this image's
            # docker-entrypoint.d startup hook) `sed -i`s the DNS resolver
            # address directly into the baked-in
            # /etc/nginx/conf.d/default.conf on every container start — the
            # same thing it does in compose.yaml. Making the root filesystem
            # read-only would break that substitution on every pod start.
            # Fixing it properly means changing the entrypoint script (in
            # the monikey repo) to render into a writable emptyDir instead;
            # tracked as a follow-up rather than done here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
