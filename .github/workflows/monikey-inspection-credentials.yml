name: Prepare MoniKey schema-inspection credentials

on:
  workflow_dispatch:
    inputs:
      confirm_inspector_provisioning:
        description: Confirm creation or safe password rotation of the catalog-only PostgreSQL login and a short-lived Kubernetes token
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: monikey-inspection-provisioning
  cancel-in-progress: false

jobs:
  environment-preflight:
    name: Verify protected provisioning environment
    if: github.ref == 'refs/heads/main' && inputs.confirm_inspector_provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      protected: ${{ steps.environment.outputs.protected }}
    steps:
      - name: Checkout reviewed GitOps validator
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify owner approval and main-only provisioning Environment
        id: environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ENVIRONMENT_NAME: monikey-inspection-provisioning
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/environment.json"
          policies="$RUNNER_TEMP/environment-branches.json"
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/environments/$ENVIRONMENT_NAME")"
          [[ "$status" == 200 ]] || {
            echo '::error::Protected provisioning Environment is missing or not readable.'
            exit 1
          }
          policy_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output "$policies" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/environments/$ENVIRONMENT_NAME/deployment-branch-policies")"
          [[ "$policy_status" == 200 ]] || {
            echo '::error::Provisioning Environment main-only branch policy is missing or not readable.'
            exit 1
          }
          python3 scripts/monikey-schema-inspect/validate_environment.py \
            "$response" "$policies" "$REPOSITORY_OWNER" \
            --environment-name "$ENVIRONMENT_NAME"
          echo 'protected=true' >> "$GITHUB_OUTPUT"
          rm -f "$response" "$policies"

  provision:
    name: Provision restricted schema-inspection credentials
    needs: environment-preflight
    if: needs.environment-preflight.outputs.protected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: monikey-inspection-provisioning
    env:
      BACKUP_KUBECONFIG_B64: ${{ secrets.MONIKEY_BACKUP_KUBECONFIG_B64 }}
      ENVIRONMENT_SECRET_WRITER_TOKEN: ${{ secrets.MONIKEY_ENVIRONMENT_SECRET_WRITER_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      EXPECTED_CONTEXT: ${{ vars.MONIKEY_SCHEMA_EXPECTED_CONTEXT }}
      EXPECTED_API_SERVER: ${{ vars.MONIKEY_SCHEMA_EXPECTED_API_SERVER }}
    steps:
      - name: Checkout reviewed provisioning scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed if dedicated setup values are absent
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKUP_KUBECONFIG_B64:?Configure the existing backup bootstrap kubeconfig secret}"
          : "${ENVIRONMENT_SECRET_WRITER_TOKEN:?Configure a fine-grained Environments:write token in this protected Environment}"
          : "${TS_OAUTH_CLIENT_ID:?Configure Tailscale connectivity credentials}"
          : "${TS_OAUTH_SECRET:?Configure Tailscale connectivity credentials}"
          : "${EXPECTED_CONTEXT:?Configure the approved cluster context as an Environment variable}"
          : "${EXPECTED_API_SERVER:?Configure the approved cluster API server as an Environment variable}"
          command -v gh >/dev/null

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Configure temporary bootstrap kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "$BACKUP_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/bootstrap"
          chmod 600 "$RUNNER_TEMP/kube/bootstrap"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/bootstrap" >> "$GITHUB_ENV"

      - name: Verify cluster and exact bootstrap permissions
        shell: bash
        run: |
          set -euo pipefail
          actual_context="$(kubectl config current-context)"
          [[ "$actual_context" == "$EXPECTED_CONTEXT" ]] || {
            echo '::error::Bootstrap context does not match the approved context.'
            exit 1
          }
          actual_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          [[ "$actual_server" == "$EXPECTED_API_SERVER" ]] || {
            echo '::error::Bootstrap API server does not match the approved cluster.'
            exit 1
          }
          kubectl config view --raw --flatten --minify -o json \
            > "$RUNNER_TEMP/kube/bootstrap.json"
          chmod 600 "$RUNNER_TEMP/kube/bootstrap.json"
          python3 - "$RUNNER_TEMP/kube/bootstrap.json" "$EXPECTED_CONTEXT" "$EXPECTED_API_SERVER" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1], encoding="utf-8"))
          clusters = config.get("clusters", [])
          contexts = config.get("contexts", [])
          if (config.get("current-context") != sys.argv[2]
                  or len(clusters) != 1 or len(contexts) != 1
                  or contexts[0].get("name") != sys.argv[2]
                  or clusters[0].get("cluster", {}).get("server") != sys.argv[3]
                  or not clusters[0].get("cluster", {}).get("certificate-authority-data")
                  or clusters[0].get("cluster", {}).get("insecure-skip-tls-verify")):
              print("::error::Bootstrap kubeconfig target or TLS validation failed.")
              raise SystemExit(1)
          PY
          kubectl --request-timeout=10s auth can-i get pods/postgres-0 --namespace monikey --quiet
          kubectl --request-timeout=10s auth can-i get pods/postgres-0 \
            --subresource=exec --namespace monikey --quiet
          kubectl --request-timeout=10s auth can-i create pods/postgres-0 \
            --subresource=exec --namespace monikey --quiet
          kubectl --request-timeout=10s auth can-i create serviceaccounts/monikey-schema-inspector \
            --subresource=token --namespace monikey --quiet
          kubectl --request-timeout=10s get pod postgres-0 --namespace monikey -o json \
            | python3 scripts/monikey-schema-inspect/check_pod.py

      - name: Create or safely rotate the PostgreSQL inspection login
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          password_file="$RUNNER_TEMP/inspector-db-password"
          openssl rand -hex 32 > "$password_file"
          chmod 600 "$password_file"
          password="$(cat "$password_file")"
          echo "::add-mask::$password"
          unset password
          if ! {
            printf "\\set inspector_password '%s'\n" "$(cat "$password_file")"
            cat scripts/monikey-schema-inspect/provision_role.sql
          } | kubectl exec --stdin --namespace monikey postgres-0 -- \
                psql -X -v ON_ERROR_STOP=1 -U monikey_app -d monikey_dev \
                > "$RUNNER_TEMP/role-provision.log" 2>&1; then
            echo '::error::Database role provisioning failed its fixed-target privilege checks.'
            exit 1
          fi

      - name: Mint an inspector-only token and configure protected Environment secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MONIKEY_ENVIRONMENT_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/inspector-token"
          base_config="$RUNNER_TEMP/kube/base.json"
          final_config="$RUNNER_TEMP/kube/inspector.json"
          kubectl create token monikey-schema-inspector --namespace monikey \
            --duration=1h > "$token_file"
          chmod 600 "$token_file"
          token="$(cat "$token_file")"
          echo "::add-mask::$token"
          unset token
          kubectl config view --raw --flatten --minify -o json > "$base_config"
          python3 scripts/monikey-schema-inspect/build_kubeconfig.py \
            "$base_config" "$token_file" "$final_config" \
            --expected-context "$EXPECTED_CONTEXT" \
            --expected-server "$EXPECTED_API_SERVER"
          gh secret set MONIKEY_SCHEMA_INSPECTION_DB_PASSWORD \
            --repo "$GITHUB_REPOSITORY" --env monikey-production-inspection \
            < "$RUNNER_TEMP/inspector-db-password"
          base64 -w0 "$final_config" \
            | gh secret set MONIKEY_SCHEMA_INSPECTION_KUBECONFIG_B64 \
                --repo "$GITHUB_REPOSITORY" --env monikey-production-inspection
          echo 'Protected inspection secrets updated. The Kubernetes token was requested for one hour; run the schema inspection promptly.'

      - name: Remove temporary credentials and files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/inspector-db-password" "$RUNNER_TEMP/inspector-token" \
            "$RUNNER_TEMP/kube/bootstrap" "$RUNNER_TEMP/kube/bootstrap.json" "$RUNNER_TEMP/kube/base.json" \
            "$RUNNER_TEMP/kube/inspector.json" "$RUNNER_TEMP/role-provision.log"
