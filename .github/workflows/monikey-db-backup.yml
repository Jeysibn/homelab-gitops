name: MoniKey database backup

on:
  workflow_dispatch:
    inputs:
      confirm_live_backup:
        description: Confirm that this run will read the live MoniKey database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monikey-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up and verify MoniKey database
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG_B64: ${{ secrets.MONIKEY_BACKUP_KUBECONFIG_B64 }}
      BACKUP_PASSPHRASE: ${{ secrets.MONIKEY_BACKUP_PASSPHRASE }}

    steps:
      - name: Check backup credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${KUBECONFIG_B64:?Set the MONIKEY_BACKUP_KUBECONFIG_B64 repository secret}"
          : "${BACKUP_PASSPHRASE:?Set the MONIKEY_BACKUP_PASSPHRASE repository secret}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Configure namespace-scoped Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Check cluster access
        shell: bash
        run: |
          set -euo pipefail
          kubectl auth can-i get pods --namespace monikey --quiet
          kubectl auth can-i get pods/exec postgres-0 --namespace monikey --quiet
          kubectl get pod postgres-0 --namespace monikey --output=name > /dev/null

      - name: Create logical backup
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/monikey-${GITHUB_RUN_ID}.dump"
          kubectl exec --namespace monikey postgres-0 -- \
            pg_dump -U monikey_app -d monikey_dev -Fc > "$backup"
          test -s "$backup"
          echo "MONIKEY_BACKUP_FILE=$backup" >> "$GITHUB_ENV"

      - name: Verify backup by restoring into a disposable database
        shell: bash
        run: |
          set -euo pipefail
          container="monikey-backup-verify-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --env POSTGRES_DB=monikey_backup_verify \
            --env POSTGRES_PASSWORD=temporary-verification-only \
            postgres:17.6-alpine > /dev/null

          ready=false
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready --username=postgres \
              --dbname=monikey_backup_verify > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]

          docker exec --interactive "$container" \
            pg_restore --username=postgres --dbname=monikey_backup_verify \
              --no-owner --exit-on-error < "$MONIKEY_BACKUP_FILE" > /dev/null

      - name: Encrypt backup for artifact storage
        shell: bash
        run: |
          set -euo pipefail
          passphrase_file="$RUNNER_TEMP/backup.passphrase"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --symmetric --cipher-algo AES256 \
            --output "$MONIKEY_BACKUP_FILE.gpg" "$MONIKEY_BACKUP_FILE"
          rm -f "$passphrase_file" "$MONIKEY_BACKUP_FILE"
          sha256sum "$MONIKEY_BACKUP_FILE.gpg" | tee "$RUNNER_TEMP/backup.sha256"
          echo "MONIKEY_ENCRYPTED_BACKUP=$MONIKEY_BACKUP_FILE.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: monikey-db-backup-${{ github.run_id }}
          path: ${{ env.MONIKEY_ENCRYPTED_BACKUP }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary backup files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/monikey-*.dump "$RUNNER_TEMP"/monikey-*.dump.gpg \
            "$RUNNER_TEMP/backup.passphrase" "$RUNNER_TEMP/kube/config"
