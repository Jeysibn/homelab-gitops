name: Kubernetes Manifest Validation

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'kubernetes/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'kubernetes/**'

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  validate:
    name: Lint & Validate Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup YAML Linter
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes/

      - name: Run Kubeconform
        uses: yannh/kubeconform-action@v0.8.0
        with:
          k8s-version: '1.30.0'
          ignore-missing-schemas: true
          schema-locations: |
            default
            https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
          files: 'kubernetes/'