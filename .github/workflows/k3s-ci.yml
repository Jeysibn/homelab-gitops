name: Kubernetes & Helm Validation

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'kubernetes/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'kubernetes/**'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Render, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: 1. YAML Syntax Check
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes/

      - name: Install Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: 2. Helm Template & Render Check
        run: |
          touch rendered-manifests.yaml

          for file in kubernetes/argocd-apps/*.yaml; do
            yq eval-all -o=json '.' "$file" | jq -c '.[]? // .' | while read -r doc; do
              echo "$doc" | jq -c '.spec.sources[]? // .spec.source // empty' | while read -r src; do
                chart=$(echo "$src" | jq -r '.chart // empty')
                if [ -n "$chart" ]; then
                  repo=$(echo "$src" | jq -r '.repoURL')
                  version=$(echo "$src" | jq -r '.targetRevision')
                  val_file=$(echo "$src" | jq -r '.helm.valueFiles[0] // empty' | sed 's|\$values/||')

                  echo "Rendering $chart ($version) from $repo"

                  if [ -n "$val_file" ] && [ -f "$val_file" ]; then
                    helm template "$chart" "$chart" --repo "$repo" --version "$version" -f "$val_file" >> rendered-manifests.yaml
                  else
                    helm template "$chart" "$chart" --repo "$repo" --version "$version" >> rendered-manifests.yaml
                  fi
                fi
              done
            done
          done

      - name: 3. Validate Kubernetes Manifests (Kubeconform)
        run: |
          kubeconform \
            -kubernetes-version 1.30.0 \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/manifests/ kubernetes/argocd-apps/ rendered-manifests.yaml

      - name: 4. Scan Manifests for Misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-by-default: true
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'