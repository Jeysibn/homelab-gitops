name: Kubernetes CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'kubernetes/**'
      - '.github/workflows/k3s-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'kubernetes/**'
      - '.github/workflows/k3s-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: bash -n kubernetes/bootstrap/*.sh

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes/

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Helm manifests
        run: |
          helm lint kubernetes/argocd-apps
          helm template argocd-applications kubernetes/argocd-apps \
            --namespace argocd > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -kubernetes-version 1.36.0 \
            -strict \
            -ignore-missing-schemas \
            kubernetes/bootstrap/*.yaml \
            kubernetes/manifests/ \
            rendered-manifests.yaml
